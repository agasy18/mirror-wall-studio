<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Primary SEO. Title is front-loaded with search intent: the brand has no
         equity yet, and SERPs truncate around 60 characters. -->
    <title>Custom Mirror Shape Designer — Free 1:1 Printable Template</title>
    <meta
      name="description"
      content="Design an organic wavy mirror on a photo of your wall, then print a full-size (1:1) multi-page cutting template on A4, A3 or Letter paper. Free browser tool — no install."
    />
    <meta name="author" content="Mirror Wall Studio" />
    <meta name="theme-color" content="#0a0c10" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f4f5f8" media="(prefers-color-scheme: light)" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://agasy18.github.io/mirror-wall-studio/" />

    <!-- Icons / installability. %BASE_URL% is substituted by Vite, so these stay
         correct under the /mirror-wall-studio/ subpath. -->
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Mirror Wall Studio — Design & Print a 1:1 Mirror Template" />
    <meta
      property="og:description"
      content="Shape a custom mirror on your wall photo and print a true-to-size cutting template across multiple sheets."
    />
    <meta property="og:site_name" content="Mirror Wall Studio" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://agasy18.github.io/mirror-wall-studio/" />
    <meta property="og:image" content="https://agasy18.github.io/mirror-wall-studio/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A printed 1:1 paper template next to the finished organic wall mirror it produced"
    />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mirror Wall Studio — Design & Print a 1:1 Mirror Template" />
    <meta
      name="twitter:description"
      content="Shape a custom mirror on your wall photo and print a true-to-size cutting template."
    />
    <meta name="twitter:image" content="https://agasy18.github.io/mirror-wall-studio/og-image.jpg" />
    <meta
      name="twitter:image:alt"
      content="A printed 1:1 paper template next to the finished organic wall mirror it produced"
    />

    <!-- Structured data: SoftwareApplication + How-to -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": ["SoftwareApplication", "WebApplication"],
        "name": "Mirror Wall Studio",
        "url": "https://agasy18.github.io/mirror-wall-studio/",
        "image": "https://agasy18.github.io/mirror-wall-studio/og-image.jpg",
        "screenshot": "https://agasy18.github.io/mirror-wall-studio/editing.webp",
        "applicationCategory": "DesignApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "description": "Design a custom organic mirror on a photo of your wall and export a 1:1 multi-page cutting template for printing.",
        "featureList": [
          "Perspective-correct wall calibration",
          "126 mirror shape templates",
          "Editable smooth curves",
          "1:1 tiled PDF export (A4, A3, Letter, Legal, A2)",
          "Live in-room preview"
        ]
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "HowTo",
        "name": "How to design and print a custom mirror template",
        "totalTime": "PT15M",
        "step": [
          { "@type": "HowToStep", "name": "Photograph the wall", "text": "Take a photo of the wall where the mirror will go." },
          { "@type": "HowToStep", "name": "Calibrate", "text": "Mark a known rectangle on the wall and enter its real size in centimeters to set the scale." },
          { "@type": "HowToStep", "name": "Design", "text": "Pick a mirror shape and refine its curves directly on the straightened wall." },
          { "@type": "HowToStep", "name": "Print 1:1", "text": "Export a full-size multi-page PDF, print at 100%, tape the sheets, and trace the shape." }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
